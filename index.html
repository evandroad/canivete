<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>Meus projetos</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111827;
      color: #f9fafb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(ellipse at 15% 0%, rgba(99, 102, 241, 0.18), transparent 38rem),
        #111827;
    }

    main {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
      padding: 76px 0 64px;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: #a5b4fc;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 6vw, 3.5rem);
      letter-spacing: -0.055em;
      line-height: 1.05;
    }

    .intro {
      max-width: 560px;
      margin: 18px 0 40px;
      color: #9ca3af;
      font-size: 1.05rem;
      line-height: 1.65;
    }

    .projects {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 310px), 1fr));
      gap: 24px;
    }

    .project-card {
      overflow: hidden;
      border: 1px solid #293449;
      border-radius: 18px;
      background: #192233;
      color: inherit;
      text-decoration: none;
      transition: border-color 180ms ease, transform 180ms ease, box-shadow 180ms ease;
    }

    .project-card:hover,
    .project-card:focus-visible {
      transform: translateY(-4px);
      border-color: #818cf8;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.24);
      outline: none;
    }

    .preview {
      height: 200px;
      overflow: hidden;
      border-bottom: 1px solid #293449;
      background: #f3f4f6;
    }

    .preview iframe {
      display: block;
      height: 460px;
      border: 0;
      pointer-events: none;
      transform: scale(0.60);
      transform-origin: top left;
      width: 170%;
    }

    .project-info {
      padding: 16px 16px 16px;
    }

    .project-info h2 {
      margin: 0 0 8px;
      font-size: 1.2rem;
      letter-spacing: -0.02em;
    }

    .project-info p {
      margin: 0;
      color: #9ca3af;
      font-size: 0.94rem;
      line-height: 1.55;
    }

    .open-project {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 18px;
      color: #a5b4fc;
      font-size: 0.9rem;
      font-weight: 650;
    }

    .open-project span {
      transition: transform 180ms ease;
    }

    .project-card:hover .open-project span,
    .project-card:focus-visible .open-project span {
      transform: translateX(4px);
    }

    @media (max-width: 520px) {
      main {
        width: min(100% - 32px, 420px);
        padding-top: 52px;
      }

      .intro {
        margin-bottom: 30px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Coleção de projetos</p>
      <h1>Ferramentas e Utilitários</h1>
      <p class="intro">Uma seleção de apps e experimentos. Escolha um card para abrir o projeto.</p>
    </header>

    <section class="projects" id="projects" aria-label="Projetos"></section>
  </main>
  <script>
    const projetos = [
      {
        nome: "Ferramenta de Conversão de Unidades",
        descricao: "Converta unidades de medida de forma rápida e fácil.",
        link: "./01-units-tool/",
        previa: "./01-units-tool/index.html"
      },
      {
        nome: "Diversos Tutoriais e Dicas",
        descricao: "Descubra tutoriais e dicas úteis para aprimorar suas habilidades.",
        link: "./02-tutorials/tutorial",
        previa: "./02-tutorials/tutorial/index.html"
      },
      {
        nome: "Calculadora de IMC",
        descricao: "Calcule o Índice de Massa Corporal (IMC) e descubra sua classificação.",
        link: "./03-bmi/",
        previa: "./03-bmi/index.html"
      },
      {
        nome: "Buscador de CEP",
        descricao: "Consulte endereços pelo CEP ou encontre CEPs usando um endereço.",
        link: "./04-cep/",
        previa: "./04-cep/index.html"
      },
      {
        nome: "Gerador de QR Code",
        descricao: "Crie códigos QR para compartilhar links e informações.",
        link: "./05-qrcode-gen/",
        previa: "./05-qrcode-gen/index.html"
      },
      {
        nome: "Teste de API Rest",
        descricao: "Teste e valide endpoints de API RESTful.",
        link: "./06-api-test/",
        previa: "./06-api-test/index.html"
      },
      {
        nome: "Calculadora de Horário de Trabalho",
        descricao: "Calcule o horário de trabalho com base em horas trabalhadas e pausas.",
        link: "./07-calculate-time/",
        previa: "./07-calculate-time/index.html"
      },
      {
        nome: "Perfil de Evandro",
        descricao: "Uma página pessoal com informações sobre Evandro, incluindo links para redes sociais e projetos.",
        link: "./08-evandro/",
        previa: "./08-evandro/index.html"
      },
      {
        nome: "Minha Numerologia",
        descricao: "Explore a numerologia do seu nome e da sua data de nascimento.",
        link: "./09-numerologia/",
        previa: "./09-numerologia/index.html"
      }
    ];

    const listaProjetos = document.getElementById("projects");

    for (const projeto of projetos) {
      const card = document.createElement("a");
      card.className = "project-card";
      card.href = projeto.link;
      card.setAttribute("aria-label", `Abrir ${projeto.nome}`);

      const preview = document.createElement("div");
      preview.className = "preview";
      preview.setAttribute("aria-hidden", "true");

      const iframe = document.createElement("iframe");
      iframe.src = projeto.previa;
      iframe.title = `Prévia do ${projeto.nome}`;
      iframe.loading = "lazy";
      iframe.tabIndex = -1;
      preview.appendChild(iframe);

      const info = document.createElement("div");
      info.className = "project-info";

      const titulo = document.createElement("h2");
      titulo.textContent = projeto.nome;

      const descricao = document.createElement("p");
      descricao.textContent = projeto.descricao;

      const abrir = document.createElement("span");
      abrir.className = "open-project";
      abrir.append("Abrir projeto ");

      const seta = document.createElement("span");
      seta.setAttribute("aria-hidden", "true");
      seta.textContent = "→";
      abrir.appendChild(seta);

      info.append(titulo, descricao, abrir);
      card.append(preview, info);
      listaProjetos.appendChild(card);
    }
  </script>
</body>
</html>

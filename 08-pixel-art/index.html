
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../style.css">
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <title>Criador de Pixel Art</title>
</head>

<body>
  <main id="app">
    <h1>Criador de Pixel Art</h1>

    <p>
      Defina o tamanho da grade, clique nos quadrados
      para escolher suas cores e salve como PNG.
    </p>

    <section class="toolbar">
      <label>
        Colunas
        <input class="app-input" type="number" min="1" max="100" v-model.number="columns" @change="resizeGrid">
      </label>

      <label>
        Linhas
        <input class="app-input" type="number" min="1" max="100" v-model.number="rows" @change="resizeGrid">
      </label>

      <label>
        Tam. pixel (px)
        <input class="app-input" type="number" min="1" max="1000" v-model.number="pixelSize">
      </label>

      <button @click="saveProject" class="app-button button-secondary">
        Salvar projeto
      </button>

      <button @click="$refs.projectFile.click()" class="app-button button-secondary">
        Abrir projeto
      </button>

      <input type="file" ref="projectFile" accept=".json,application/json" hidden @change="handleProjectFile">

      <button @click="openColorPickerForSelection" class="app-button button-secondary">
        Aplicar cor
      </button>

      <button @click="savePng" class="app-button button-primary">
        Salvar PNG
      </button>
    </section>

    <div id="gridWrap">
      <div id="grid" :style="gridStyle">
        <template v-for="(pixelRow, rowIndex) in pixels" :key="rowIndex">
          <button
            v-for="(color, colIndex) in pixelRow"
            :key="`${rowIndex}-${colIndex}`"
            type="button"
            class="pixel"
            :class="{ selected: isPixelSelected(rowIndex, colIndex) }"
            :style="{ backgroundColor: color }"
            :aria-label="`Pixel linha ${rowIndex + 1}, coluna ${colIndex + 1}`"
            @click="openColorPicker(rowIndex, colIndex)"
            @contextmenu.prevent="togglePixelSelection(rowIndex, colIndex)"
          ></button>
        </template>
      </div>
    </div>

    <dialog ref="colorDialog" id="colorDialog">
      <form @submit.prevent="confirmColor">
        <h2>Escolha a cor do pixel</h2>

        <div class="color-row">
          <input v-model="selectedColor" type="color" id="pixelColor">
          <span>{{ selectedColor }}</span>
        </div>

        <div class="recent-colors-container">
          <label>Últimas cores utilizadas</label>
          <div class="recent-colors">
            <button
              v-for="color in recentColors"
              :key="color"
              type="button"
              class="recent-color"
              :style="{ backgroundColor: color }"
              :title="color"
              :aria-label="`Usar cor ${color}`"
              @click="applyPixelColor(color); closeColorDialog()"
            ></button>
          </div>
        </div>

        <div class="dialog-actions">
          <button type="button" class="app-button button-secondary" @click="closeColorDialog">
            Cancelar
          </button>

          <button type="submit" class="app-button button-primary">
            Aplicar cor
          </button>
        </div>
      </form>
    </dialog>
  </main>

  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="script.js"></script>
</body>
</html>

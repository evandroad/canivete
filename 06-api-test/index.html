<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="shortcut icon" type="image/x-png" href="dev.png"/>
	<script src="https://kit.fontawesome.com/0416c4eefa.js" crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
	<script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
	<script src="script.js"></script>
	<title>Test API</title>
</head>

<body class="min-h-screen bg-[#111827]">
	<main class="min-h-screen bg-[radial-gradient(ellipse_at_15%_0%,rgba(99,102,241,0.18),transparent_38rem)] bg-no-repeat flex flex-col items-center">
		<h1 class="text-gray-300 text-4xl my-4">Test API</h1>

		<div id="app" class="flex flex-row text-gray-300 grid grid-cols-[2fr_3fr_3fr] w-5/6 gap-2" x-data="data()">
			<div x-show="showInsertUrl" x-cloak x-transition.opacity @keydown.escape.window="showInsertUrl = false" @click.self="showInsertUrl = false" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4">
				<div x-show="showInsertUrl" x-transition @click.stop class="w-full max-w-lg overflow-hidden rounded-xl bg-gray-800 shadow-2xl">
					<div class="flex items-center justify-between border-b border-gray-700 px-6 py-4">
						<h2 class="text-sm font-semibold text-white">Inserir URL</h2>
						<button type="button" @click="showInsertUrl = false" class="text-3xl leading-none text-gray-400 transition hover:text-white cursor-pointer">
							&times;
						</button>
					</div>

					<div class="p-6">
						<div class="mb-5">
							<label for="addUrl" class="mb-2 block text-sm font-medium text-gray-300">URL:</label>
							<input type="text" x-model="addUrl" x-ref="urlInput" placeholder="https://exemplo.com" class="w-full rounded-lg border border-gray-500 bg-gray-800 px-4 py-2.5 text-white placeholder-gray-500 outline-none transition focus:border-blue-600 focus:ring-1 focus:ring-blue-600/20">
						</div>

						<div class="flex justify-end gap-3">
							<button type="button" @click="showInsertUrl = false" class="rounded-lg bg-gray-700/50 px-4 py-2 text-sm font-medium text-gray-200 transition hover:bg-gray-700 cursor-pointer">
								Cancelar
							</button>
							<button type="submit" @click="insertUrl" class="rounded-lg bg-blue-600/50 px-4 py-2 text-sm font-medium text-white transition hover:bg-blue-700 cursor-pointer">
								Salvar
							</button>
						</div>
					</div>
				</div>
			</div>

			<div x-show="showCreateFolder" x-cloak x-transition.opacity @keydown.escape.window="showCreateFolder = false" @click.self="showCreateFolder = false" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4">
				<div x-show="showCreateFolder" x-transition @click.stop class="w-full max-w-lg overflow-hidden rounded-xl bg-gray-800 shadow-2xl">
					<div class="flex items-center justify-between border-b border-gray-700 px-6 py-4">
						<h2 class="text-sm font-semibold text-white">Criar Pasta</h2>
						<button type="button" @click="showCreateFolder = false" class="text-3xl leading-none text-gray-400 transition hover:text-white cursor-pointer">
							&times;
						</button>
					</div>

					<div class="p-6">
						<div class="mb-5">
							<label for="addFolder" class="mb-2 block text-sm font-medium text-gray-300">Nome:</label>
							<input type="text" x-model="addFolder" x-ref="folderInput" placeholder="Nome da Pasta" class="w-full rounded-lg border border-gray-500 bg-gray-800 px-4 py-2.5 text-white placeholder-gray-500 outline-none transition focus:border-blue-600 focus:ring-1 focus:ring-blue-600/20">
						</div>

						<div class="flex justify-end gap-3">
							<button type="button" @click="showCreateFolder = false" class="rounded-lg bg-gray-700 px-4 py-1 text-sm font-medium text-gray-200 transition hover:bg-gray-600 cursor-pointer">
								Cancelar
							</button>
							<button type="submit" @click="newFolder" class="rounded-lg bg-blue-600/50 px-4 py-2 text-sm font-medium text-white transition hover:bg-blue-700 cursor-pointer">
								Salvar
							</button>
						</div>
					</div>
				</div>
			</div>
	
			<div>
				<template x-if="isContextMenuVisible">
					<div @click.outside="isContextMenuVisible = false" :style="{top: contextMenuPosition.y + 'px', left: contextMenuPosition.x + 'px'}" class="fixed z-[1000] rounded border border-[#4b4b4b] bg-[#292929] shadow-[0_2px_4px_#0000001a]">
						<ul class="m-0 flex list-none flex-row p-0">
              <li @click="moveRequestUp()" class="cursor-pointer px-3 py-2 hover:bg-[#1a1a1a]" title="Mover para cima">
								<i class="fa-solid fa-arrow-up"></i>
							</li>
							<li @click="moveRequestDown()" class="cursor-pointer px-3 py-2 hover:bg-[#1a1a1a]" title="Mover para baixo">
								<i class="fa-solid fa-arrow-down"></i>
							</li>
							<li @click="showContextMenuFolders($event)" class="cursor-pointer px-3 py-2 hover:bg-[#1a1a1a]" title="Mover para pasta">
								<i class="fa-solid fa-turn-up"></i>
							</li>
							<li @click="moveOutOfTheFolder()" class="cursor-pointer px-3 py-2 hover:bg-[#1a1a1a]" title="Sair da pasta">
								<i class="fa-solid fa-turn-down"></i>
							</li>
						</ul>
					</div>
				</template>
			</div>
	
			<div>
				<template x-if="isContextMenuFolderVisible">
					<div @click.outside="isContextMenuFolderVisible = false" :style="{top: contextMenuPosition.y + 'px', left: contextMenuPosition.x + 'px'}" class="fixed z-[1000] rounded border border-[#4b4b4b] bg-[#292929] shadow-[0_2px_4px_#0000001a]">
						<ul class="m-0 flex list-none flex-row p-0">
							<li @click="moveFolderUp()" class="cursor-pointer px-3 py-2 hover:bg-[#1a1a1a]" title="Mover para cima">
								<i class="fa-solid fa-arrow-up"></i>
							</li>
							<li @click="moveFolderDown()" class="cursor-pointer px-3 py-2 hover:bg-[#1a1a1a]" title="Mover para baixo">
								<i class="fa-solid fa-arrow-down"></i>
							</li>
							<li @click="deleteFolder()" class="cursor-pointer px-3 py-2 hover:bg-[#1a1a1a]" title="Excluir pasta">
								<i class="fa-solid fa-trash"></i>
							</li>
						</ul>
					</div>
				</template>
			</div>
	
			<div>
				<template x-if="isContextMenuFoldersVisible">
					<div @click.outside="isContextMenuFoldersVisible = false" :style="{top: contextMenuPosition.y + 'px', left: contextMenuPosition.x + 'px'}" class="fixed z-[1000] rounded border border-[#4b4b4b] bg-[#292929] shadow-[0_2px_4px_#0000001a]">
						<ul class="m-0 max-h-60 min-w-40 list-none overflow-y-auto p-0">
							<template x-for="(folder, index) in data.folders" :key="index">
								<template x-if="folder">
									<li @click="moveRequest(folder)" x-text="folder" class="cursor-pointer px-3 py-2 hover:bg-[#1a1a1a]"></li>
								</template>
							</template>
						</ul>
					</div>
				</template>
			</div>
	
			<!-- Endpoint -->
			<div class="border border-gray-600/60 rounded-lg p-4 h-150">
				<div class="flex items-center justify-between">
					<h2 class="text-lg font-semibold">Endpoints</h2>
					<button type="button" @click="showCreateFolder = true; $nextTick(() => $refs.folderInput.focus())" class="rounded-lg p-2 text-white transition cursor-pointer">
						<i class="fa-solid fa-folder-plus hover:text-gray-300"></i>
					</button>
				</div>

				<div class="flex flex-col gap-2">
					<template x-for="folder in data.folders" :key="folder">
						<details @contextmenu.prevent="showContextMenuFolder($event, folder)" class="group">
							<summary x-text="folder" class="cursor-pointer transition-colors duration-150 hover:!text-gray-500"></summary>
	
							<template x-for="(request, index) in data.requests.filter(r => r.folder === folder)" :key="index">
								<div class="flex justify-between">
									<a class="ml-2 cursor-pointer text-blue-500 hover:text-blue-300" href="#" :style="isActive(request) ? linkFolder : {}" @click.prevent="handleItem(request)" @contextmenu.prevent.stop="showContextMenuRequest($event, request)" x-text="request.name"></a>
									<span x-text="request.method" class="bg-gray-800 text-white px-2 py-0 rounded-full"></span>
								</div>
							</template>
						</details>
					</template>
	
					<template x-for="(request, index) in data.requests.filter(r => !r.folder)" :key="index">
						<div class="flex justify-between">
							<a href="#" :style="isActive(request) ? link : {}" @click.prevent="handleItem(request)" @contextmenu.prevent="showContextMenuRequest($event, request)"
								x-text="request.name" class="cursor-pointer text-blue-500 hover:text-blue-300"></a>
							<span x-text="request.method" class="bg-gray-800 text-white px-2 py-0 rounded-full"></span>
						</div>
					</template>
				</div>
			</div>

			<!-- Request -->
			<div class="border border-gray-600/60 rounded-lg p-4 w-full">
				<h2 class="text-lg font-semibold my-1">Request</h2>
				
				<div class="flex flex-col justify-between items-center gap-1">
					<div class="w-full flex justify-center items-center gap-1 my-2">
						<button type="button" class="rounded-lg py-1 px-2 text-white transition bg-blue-800/60 hover:bg-blue-900 cursor-pointer" @click="makeRequest">
							<template x-if="!isLoading">
								<span>Enviar</span>
							</template>
							<template x-if="isLoading">
									<div class="h-6 w-6 animate-spin rounded-full border-4 border-[#e5e5e5] border-t-[#51d4db]"></div>
							</template>
						</button>
						<button type="button" class="rounded-lg py-1 px-2 text-white transition bg-gray-600/60 hover:bg-gray-500/60 cursor-pointer" @click="clearFields">
							Limpar
						</button>
						<button type="button" class="rounded-lg py-1 px-2 text-white transition bg-green-600/60 hover:bg-green-700 cursor-pointer" @click="saveRequest">
							Salvar
						</button>
						<button type="button" class="rounded-lg py-1 px-2 text-white transition bg-green-600/60 hover:bg-green-700 cursor-pointer" @click="createRequest" x-show="activeLink">
							Salvar Como
						</button>
						<button type="button" class="rounded-lg py-1 px-2 text-white transition bg-red-600/60 hover:bg-red-700 cursor-pointer" @click="removeRequest" x-show="activeLink">
							Remover
						</button>
					</div>

					<div class="grid grid-cols-[minmax(0,1fr)_100px] items-end gap-2 w-full">
						<div>
							<label for="formFile" class="mb-1 block text-sm font-medium text-gray-300">
								Carregar de arquivo
							</label>
							<input type="file" id="formFile" @change="handleFileSelect" class="block w-full rounded-lg border border-gray-600 bg-gray-800 text-sm text-gray-300
							file:mr-3 file:border-0 file:bg-gray-700 file:px-3 file:py-1 file:text-white hover:file:bg-gray-600 cursor-pointer">
						</div>

						<button type="button" @click="saveFile" class="rounded-lg px-4 py-1 text-white transition bg-blue-800/60 hover:bg-blue-900 cursor-pointer">
							Salvar
						</button>
					</div>

					<div class="grid grid-cols-[8fr_1fr_1fr] items-end gap-2 w-full">
						<div>
							<label class="mb-1 block text-sm font-medium text-gray-300">URL:</label>
							<select x-model="url" class="w-full min-w-0 rounded-lg border border-gray-600 bg-gray-800 px-2 py-1 text-white outline-none focus:border-blue-500">
								<template x-for="(item, index) in data.urls" :key="index">
									<option :value="item" x-text="item"></option>
								</template>
							</select>
						</div>

						<button type="button" @click="openInsertUrl" title="Adicionar URL" class="flex h-8 items-center justify-center rounded-lg bg-green-600/50 text-white transition hover:bg-green-700 cursor-pointer">
							<i class="fa-solid fa-plus"></i>
						</button>

						<button type="button" @click="removeUrl" title="Remover URL" class="flex h-8 items-center justify-center rounded-lg bg-red-600/50 text-white transition hover:bg-red-700 cursor-pointer">
							<i class="fa-solid fa-trash"></i>
						</button>
					</div>

					<div class="grid grid-cols-[1fr_3fr] items-end gap-2 w-full">
						<div>
							<label class="mb-1 block text-sm font-medium text-gray-300">Method:</label>
							<select x-model="formRequest.method" class="w-full rounded-lg border border-gray-600 bg-gray-800 px-2 py-1 text-white outline-none focus:border-blue-500">
								<option value=""></option>
								<option value="GET">GET</option>
								<option value="POST">POST</option>
								<option value="PUT">PUT</option>
								<option value="DELETE">DELETE</option>
							</select>
						</div>

						<div>
							<label class="mb-1 block text-sm font-medium text-gray-300">Nome:</label>
							<input type="text" x-model="formRequest.name" class="w-full rounded-lg border border-gray-600 bg-gray-800 px-3 py-1 text-white outline-none focus:border-blue-500">
						</div>
					</div>

					<div class="w-full">
						<label class="mb-1 block text-sm font-medium text-gray-300">Endpoint:</label>
						<input type="text" x-model="formRequest.endpoint" class="w-full rounded-lg border border-gray-600 bg-gray-800 px-3 py-1 text-white outline-none focus:border-blue-500">
					</div>

					<div class="w-full">
						<label class="mb-1 block text-sm font-medium text-gray-300">Token:</label>
						<input type="text" x-model="token" class="w-full rounded-lg border border-gray-600 bg-gray-800 px-3 py-1 text-white outline-none focus:border-blue-500">
					</div>

					<div x-show="formRequest.method === 'POST' || formRequest.method === 'PUT'" class="w-full">
						<label class="mb-1 block text-sm font-medium text-gray-300">Body:</label>
						<textarea rows="6" x-model="formRequest.body" class="w-full resize-y rounded-lg border border-gray-600 bg-gray-800 px-3 py-2 font-mono text-sm text-white outline-none focus:border-blue-500"></textarea>
					</div>
				</div>
			</div>

			<!-- Response -->
			<div class="border border-gray-600/60 rounded-lg p-4 max-w-200 overflow-y-auto">
				<div class="flex items-center justify-between">
					<h2 class="text-lg font-semibold my-1">Response</h2>
					<span x-show="status">Status: 
						<span id="status" :style="{background: (status >= 200 && status <= 299) ? 'green' : 'red', borderRadius: '5px', margin: '5px', padding: '3px'}" x-text="status"></span>
					</span>
				</div>
				<pre x-show="result.length > 0" class="bg-gray-800 text-white font-mono text-sm rounded-lg p-2 m-2 max-h-[500px] overflow-y-auto overflow-x-auto whitespace-pre-wrap break-words" x-text="result"></pre>
			</div>
		</div>
	</main>
</body>
</html>

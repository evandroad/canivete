<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="style.css">
	<link rel="shortcut icon" type="image/x-png" href="dev.png"/>
	<script src="https://kit.fontawesome.com/0416c4eefa.js" crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
	<script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
	<script src="script.js"></script>
	<title>Test API</title>
</head>

<body class="min-h-screen bg-[#111827]">
	<main class="min-h-screen bg-[radial-gradient(ellipse_at_15%_0%,rgba(99,102,241,0.18),transparent_38rem)] bg-no-repeat flex flex-col items-center">
		<h1 class="text-gray-300 text-4xl my-4">Test API</h1>
		<div id="app" class="flex flex-row text-gray-300 grid grid-cols-[2fr_3fr_3fr] w-5/6 gap-2" x-data="data()">
			<div x-show="showInsertUrl" x-cloak x-transition.opacity @keydown.escape.window="showInsertUrl = false" @click.self="showInsertUrl = false" class="fixed inset-0 z-50 flex items-center justify-center p-4">
				<div x-show="showInsertUrl" x-transition @click.stop class="w-full max-w-lg overflow-hidden rounded-xl bg-gray-800 shadow-2xl">
					<div class="flex items-center justify-between border-b border-gray-700 px-6 py-4">
						<h2 class="text-sm font-semibold text-white">Inserir URL</h2>
						<button type="button" @click="showInsertUrl = false" class="text-3xl leading-none text-gray-400 transition hover:text-white">
							&times;
						</button>
					</div>

					<div class="p-6">
						<form @submit.prevent="insertUrl">
							<div class="mb-5">
								<label for="addUrl" class="mb-2 block text-sm font-medium text-gray-300">URL:</label>
								<input type="text" x-model="addUrl" placeholder="https://exemplo.com" class="w-full rounded-lg border border-gray-500 bg-gray-800 px-4 py-2.5 text-white placeholder-gray-500 outline-none transition focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500/20">
							</div>

							<div class="flex justify-end gap-3">
								<button type="button" @click="showInsertUrl = false" class="rounded-lg bg-gray-700 px-4 py-2 text-sm font-medium text-gray-200 transition hover:bg-gray-600">
									Cancelar
								</button>
								<button type="submit" @click="insertUrl" class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white transition hover:bg-indigo-500">
									Salvar
								</button>
							</div>
						</form>
					</div>
				</div>
			</div>

			<div x-show="showCreateFolder" x-cloak x-transition.opacity @keydown.escape.window="showCreateFolder = false" @click.self="showCreateFolder = false" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4">
				<div x-show="showCreateFolder" x-transition @click.stop class="w-full max-w-lg overflow-hidden rounded-xl bg-gray-800 shadow-2xl">
					<div class="flex items-center justify-between border-b border-gray-700 px-6 py-4">
						<h2 class="text-sm font-semibold text-white">Criar Pasta</h2>
						<button type="button" @click="showCreateFolder = false" class="text-3xl leading-none text-gray-400 transition hover:text-white">
							&times;
						</button>
					</div>

					<div class="p-6">
						<form @submit.prevent="newFolder">
							<div class="mb-5">
								<label for="addFolder" class="mb-2 block text-sm font-medium text-gray-300">Nome:</label>
								<input type="text" x-model="addFolder" placeholder="Nome da Pasta" class="w-full rounded-lg border border-gray-500 bg-gray-800 px-4 py-2.5 text-white placeholder-gray-500 outline-none transition focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500/20">
							</div>

							<div class="flex justify-end gap-3">
								<button type="button" @click="showCreateFolder = false" class="rounded-lg bg-gray-700 px-4 py-1 text-sm font-medium text-gray-200 transition hover:bg-gray-600">
									Cancelar
								</button>
								<button type="submit" @click="newFolder" class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white transition hover:bg-indigo-500">
									Salvar
								</button>
							</div>
						</form>
					</div>
				</div>
			</div>

			<div x-show="showInsertRequest" x-cloak x-transition.opacity @keydown.escape.window="showInsertRequest = false" @click.self="showInsertRequest = false" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4">
				<div x-show="showInsertRequest" x-transition @click.stop class="w-full max-w-lg overflow-hidden rounded-xl bg-gray-800 shadow-2xl">
					<div class="flex items-center justify-between border-b border-gray-700 px-6 py-4">
						<h2 class="text-sm font-semibold text-white">Criar Requisição</h2>
						<button type="button" @click="showInsertRequest = false" class="text-3xl leading-none text-gray-400 transition hover:text-white">
							&times;
						</button>
					</div>

					<div class="p-6">
						<form @submit.prevent="createRequest">
							<div class="mb-5">
								<label for="addName" class="mb-2 block text-sm font-medium text-gray-300">Nome:</label>
								<input type="text" x-model="addName" placeholder="Nome da Requisição" class="w-full rounded-lg border border-gray-500 bg-gray-800 px-4 py-2.5 text-white placeholder-gray-500 outline-none transition focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500/20">
							</div>

							<div class="flex justify-end gap-3">
								<button type="button" @click="showInsertRequest = false" class="rounded-lg bg-gray-700 px-4 py-2 text-sm font-medium text-gray-200 transition hover:bg-gray-600">
									Cancelar
								</button>
								<button type="submit" @click="createRequest" class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white transition hover:bg-indigo-500">
									Salvar
								</button>
							</div>
						</form>
					</div>
				</div>
			</div>
	
			<div>
				<template x-if="isContextMenuVisible">
					<div class="context-menu" @click.outside="isContextMenuVisible = false" :style="{top: contextMenuPosition.y + 'px', left: contextMenuPosition.x + 'px'}">
						<ul style="display: flex; flex-direction: row">
							<li @click="moveRequestUp()"><i class="fa-solid fa-arrow-up"></i></li>
							<li @click="moveRequestDown()"><i class="fa-solid fa-arrow-down"></i></li>
							<li @click="showContextMenuFolders($event)"><i class="fa-solid fa-turn-up"></i></li>
							<li @click="moveOutOfTheFolder()"><i class="fa-solid fa-turn-down"></i></li>
						</ul>
					</div>
				</template>
			</div>
	
			<div>
				<template x-if="isContextMenuFolderVisible">
					<div class="context-menu" @click.outside="isContextMenuFolderVisible = false" :style="{top: contextMenuPosition.y + 'px', left: contextMenuPosition.x + 'px'}">
						<ul style="display: flex; flex-direction: row">
							<li @click="moveFolderUp()"><i class="fa-solid fa-arrow-up"></i></li>
							<li @click="moveFolderDown()"><i class="fa-solid fa-arrow-down"></i></li>
							<li @click="deleteFolder()"><i class="fa-solid fa-trash"></i></li>
						</ul>
					</div>
				</template>
			</div>
	
			<div>
				<template x-if="isContextMenuFoldersVisible">
					<div  class="context-menu" @click.outside="isContextMenuFoldersVisible = false" :style="{top: contextMenuPosition.y + 'px', left: contextMenuPosition.x + 'px'}">
						<ul>
							<template x-for="(request, index) in data.requests" :key="index">
								<template x-if="request.folder">
									<li @click="moveRequest(request.folder)" x-text="request.folder"></li>
								</template>
							</template>
						</ul>
					</div>
				</template>
			</div>
	
			<div class="border border-gray-600/60 rounded-lg p-4 h-150">
				<div class="flex items-center justify-between">
					<h2 class="text-lg font-semibold">Endpoints</h2>
					<button type="button" @click="showCreateFolder = true" class="rounded-lg p-2 text-white transition">
						<i class="fa-solid fa-folder-plus hover:text-gray-300"></i>
					</button>
				</div>

				<template x-for="folder in data.folders" :key="folder">
					<details @contextmenu.prevent="showContextMenuFolder($event, folder)">
						<summary x-text="folder"></summary>

						<template x-for="(request, index) in data.requests.filter(r => r.folder === folder)" :key="index">
							<div class="link">
								<a class="ml" href="#" :style="isActive(request) ? linkFolder : {}" @click.prevent="handleItem(request)" @contextmenu.prevent.stop="showContextMenuRequest($event, request)" x-text="request.name"></a>
								<span x-text="request.method"></span>
							</div>
						</template>
					</details>
				</template>

				<template x-for="(request, index) in data.requests.filter(r => !r.folder)" :key="index">
					<div class="link">
						<a href="#" :style="isActive(request) ? link : {}" @click.prevent="handleItem(request)" @contextmenu.prevent="showContextMenuRequest($event, request)"
							x-text="request.name"></a>
						<span x-text="request.method"></span>
					</div>
				</template>
			</div>

			<div class="border border-gray-600/60 rounded-lg p-4">
				<h2 class="text-lg font-semibold my-1">Request</h2>
				
				<div class="flex flex-col justify-between items-center h-full">
					<div class="flex flex-col gap-2">
						<div class="grid grid-cols-[minmax(0,1fr)_100px] items-end gap-2">
							<div>
								<label for="formFile" class="mb-1 block text-sm font-medium text-gray-300">
									Carregar de arquivo
								</label>
								<input type="file" id="formFile" @change="handleFileSelect" class="block w-full rounded-lg border border-gray-600 bg-gray-800 text-sm text-gray-300
								file:mr-3 file:border-0 file:bg-gray-700 file:px-3 file:py-1 file:text-white hover:file:bg-gray-600 cursor-pointer">
							</div>

							<button type="button" @click="saveFile" class="rounded-lg px-4 py-1 text-white transition bg-blue-800/60 hover:bg-blue-900 cursor-pointer">
								Salvar
							</button>
						</div>

						<div class="grid grid-cols-[3fr_1fr] items-end gap-2">
							<div>
								<label class="mb-1 block text-sm font-medium text-gray-300">Nome:</label>
								<input type="text" x-model="formRequest.name" class="w-full rounded-lg border border-gray-600 bg-gray-800 px-3 py-1 text-white outline-none focus:border-blue-500">
							</div>
	
							<div>
								<label class="mb-1 block text-sm font-medium text-gray-300">Method:</label>
								<select x-model="formRequest.method" class="w-full rounded-lg border border-gray-600 bg-gray-800 px-2 py-1 text-white outline-none focus:border-blue-500">
									<option value=""></option>
									<option value="GET">GET</option>
									<option value="POST">POST</option>
									<option value="PUT">PUT</option>
									<option value="DELETE">DELETE</option>
								</select>
							</div>
						</div>

						<div class="grid grid-cols-[8fr_1fr_1fr] items-end gap-2">
							<div>
								<label class="mb-1 block text-sm font-medium text-gray-300">URL:</label>
								<select x-model="url" class="w-full min-w-0 rounded-lg border border-gray-600 bg-gray-800 px-2 py-1 text-white outline-none focus:border-blue-500">
									<template x-for="(item, index) in data.urls" :key="index">
										<option :value="item" x-text="item"></option>
									</template>
								</select>
							</div>

							<button type="button" @click="openInsertUrl" title="Adicionar URL" class="flex h-8 items-center justify-center rounded-lg bg-green-600 text-white transition hover:bg-green-500">
								<i class="fa-solid fa-plus"></i>
							</button>

							<button type="button" @click="removeUrl" title="Remover URL" class="flex h-8 items-center justify-center rounded-lg bg-red-600 text-white transition hover:bg-red-500">
								<i class="fa-solid fa-trash"></i>
							</button>
						</div>

						<div>
							<label class="mb-1 block text-sm font-medium text-gray-300">Endpoint:</label>
							<input type="text" x-model="formRequest.endpoint" class="w-full rounded-lg border border-gray-600 bg-gray-800 px-3 py-1 text-white outline-none focus:border-blue-500">
						</div>

						<div>
							<label class="mb-1 block text-sm font-medium text-gray-300">Token:</label>
							<input type="text" x-model="formRequest.token" class="w-full rounded-lg border border-gray-600 bg-gray-800 px-3 py-1 text-white outline-none focus:border-blue-500">
						</div>

						<div x-show="formRequest.method === 'POST' || formRequest.method === 'PUT'">
							<label class="mb-1 block text-sm font-medium text-gray-300">Body:</label>
							<textarea rows="6" x-model="formRequest.body" class="w-full resize-y rounded-lg border border-gray-600 bg-gray-800 px-3 py-2 font-mono text-sm text-white outline-none focus:border-blue-500"></textarea>
						</div>
					</div>
					
					<div class="">
						<button type="button" class="rounded-lg py-1 px-2 text-white transition bg-blue-800/60 hover:bg-blue-900 cursor-pointer" @click="makeRequest">
							<template x-if="!isLoading">
								<span>Enviar</span>
							</template>
							<template x-if="isLoading">
								<div id="loader"></div>
							</template>
						</button>
						<button type="button" class="rounded-lg py-1 px-2 text-white transition bg-gray-600/60 hover:bg-gray-500/60 cursor-pointer" @click="clearFields">
							Limpar
						</button>
						<button type="button" class="rounded-lg py-1 px-2 text-white transition bg-green-600/60 hover:bg-green-700 cursor-pointer" @click="saveRequest">
							Salvar
						</button>
						<button type="button" class="rounded-lg py-1 px-2 text-white transition bg-green-600/60 hover:bg-green-700 cursor-pointer" @click="saveAsRequest" x-show="activeLink">
							Salvar Como
						</button>
						<button type="button" class="rounded-lg py-1 px-2 text-white transition bg-red-600/60 hover:bg-red-700 cursor-pointer" @click="removeRequest" x-show="activeLink">
							Remover
						</button>
					</div>
				</div>
			</div>

			<div class="border border-gray-600/60 rounded-lg p-4">
				<div class="flex items-center justify-between">
					<h2 class="text-lg font-semibold my-1">Response</h2>
					<span x-show="status">Status: 
						<span id="status" :style="{background: (status >= 200 && status <= 299) ? 'green' : 'red', borderRadius: '5px', margin: '5px', padding: '3px'}" x-text="status"></span>
					</span>
				</div>
				<pre id="result" class="bg-gray-800 text-white font-mono text-sm rounded-lg p-2 m-2" x-text="result"></pre>
			</div>
		</div>
	</main>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="style.css">
	<link rel="stylesheet" href="../style.css">
	<link rel="shortcut icon" type="image/x-png" href="dev.png"/>
	<script src="https://kit.fontawesome.com/0416c4eefa.js" crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
	<script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
	<script src="script.js"></script>
	<title>Test API</title>
</head>
<body>
	<h1 class="main-title">Test API</h1>

	<main>
		<div id="app" class="row" x-data="data()">
			<div x-show="showInsertUrl" x-cloak x-transition.opacity @keydown.escape.window="showInsertUrl = false" @click.self="showInsertUrl = false" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4">
				<div x-show="showInsertUrl" x-transition @click.stop class="w-full max-w-lg overflow-hidden rounded-xl bg-gray-800 shadow-2xl">
					<!-- Header -->
					<div class="flex items-center justify-between border-b border-gray-700 px-6 py-4">
						<h2 class="text-sm font-semibold text-white">Inserir URL</h2>
						<button type="button" @click="showInsertUrl = false" class="text-3xl leading-none text-gray-400 transition hover:text-white">
							&times;
						</button>
					</div>

					<!-- Body -->
					<div class="p-6">
						<form @submit.prevent="insertUrl">
							<div class="mb-5">
								<label for="addUrl" class="mb-2 block text-sm font-medium text-gray-300">URL:</label>
								<input type="text" x-model="addUrl" placeholder="https://exemplo.com" class="w-full rounded-lg border border-gray-500 bg-gray-800 px-4 py-2.5 text-white placeholder-gray-500 outline-none transition focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500/20">
							</div>

							<div class="flex justify-end gap-3">
								<button type="button" @click="showInsertUrl = false" class="rounded-lg bg-gray-700 px-4 py-2 text-sm font-medium text-gray-200 transition hover:bg-gray-600">
									Cancelar
								</button>
								<button type="submit" @click="insertUrl" class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white transition hover:bg-indigo-500">
									Salvar
								</button>
							</div>
						</form>
					</div>
				</div>
			</div>

			<div x-show="showCreateFolder" x-cloak x-transition.opacity @keydown.escape.window="showCreateFolder = false" @click.self="showCreateFolder = false" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4">
				<div x-show="showCreateFolder" x-transition @click.stop class="w-full max-w-lg overflow-hidden rounded-xl bg-gray-800 shadow-2xl">
					<!-- Header -->
					<div class="flex items-center justify-between border-b border-gray-700 px-6 py-4">
						<h2 class="text-sm font-semibold text-white">Criar Pasta</h2>
						<button type="button" @click="showCreateFolder = false" class="text-3xl leading-none text-gray-400 transition hover:text-white">
							&times;
						</button>
					</div>

					<!-- Body -->
					<div class="p-6">
						<form @submit.prevent="newFolder">
							<div class="mb-5">
								<label for="folder" class="mb-2 block text-sm font-medium text-gray-300">Nome:</label>
								<input type="text" x-model="folder" placeholder="Nome da Pasta" class="w-full rounded-lg border border-gray-500 bg-gray-800 px-4 py-2.5 text-white placeholder-gray-500 outline-none transition focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500/20">
							</div>

							<div class="flex justify-end gap-3">
								<button type="button" @click="showCreateFolder = false" class="rounded-lg bg-gray-700 px-4 py-2 text-sm font-medium text-gray-200 transition hover:bg-gray-600">
									Cancelar
								</button>
								<button type="submit" @click="newFolder" class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white transition hover:bg-indigo-500">
									Salvar
								</button>
							</div>
						</form>
					</div>
				</div>
			</div>

			<div x-show="showInsertRequest" x-cloak x-transition.opacity @keydown.escape.window="showInsertRequest = false" @click.self="showInsertRequest = false" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4">
				<div x-show="showInsertRequest" x-transition @click.stop class="w-full max-w-lg overflow-hidden rounded-xl bg-gray-800 shadow-2xl">
					<!-- Header -->
					<div class="flex items-center justify-between border-b border-gray-700 px-6 py-4">
						<h2 class="text-sm font-semibold text-white">Criar Requisição</h2>
						<button type="button" @click="showInsertRequest = false" class="text-3xl leading-none text-gray-400 transition hover:text-white">
							&times;
						</button>
					</div>

					<!-- Body -->
					<div class="p-6">
						<form @submit.prevent="createRequest">
							<div class="mb-5">
								<label for="addName" class="mb-2 block text-sm font-medium text-gray-300">Nome:</label>
								<input type="text" x-model="addName" placeholder="Nome da Requisição" class="w-full rounded-lg border border-gray-500 bg-gray-800 px-4 py-2.5 text-white placeholder-gray-500 outline-none transition focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500/20">
							</div>

							<div class="flex justify-end gap-3">
								<button type="button" @click="showInsertRequest = false" class="rounded-lg bg-gray-700 px-4 py-2 text-sm font-medium text-gray-200 transition hover:bg-gray-600">
									Cancelar
								</button>
								<button type="submit" @click="createRequest" class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white transition hover:bg-indigo-500">
									Salvar
								</button>
							</div>
						</form>
					</div>
				</div>
			</div>
	
			<div class="modal fade" id="insertRequest" tabindex="-1" aria-hidden="true">
				<div class="modal-dialog modal-dialog-centered">
					<div class="modal-content">
						<div class="modal-header">
							<h1 class="modal-title fs-5">Nome da Requisição</h1>
							<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
						</div>
						<div class="modal-body">
							<form>
								<div class="mb-3">
									<label for="addName" class="col-form-label">Nome:</label>
									<input type="text" class="form-control" id="addName" autofocus x-model="addName">
								</div>
								<button type="button" data-bs-dismiss="modal" class="btn btn-primary mb-3" @click="createRequest">Salvar</button>
							</form>
						</div>
					</div>
				</div>
			</div>
	
			<div>
				<template x-if="isContextMenuVisible">
					<div class="context-menu" @click.outside="isContextMenuVisible = false" :style="{top: contextMenuPosition.y + 'px', left: contextMenuPosition.x + 'px'}">
						<ul style="display: flex; flex-direction: row">
							<li @click="moveRequestUp()"><i class="fa-solid fa-arrow-up"></i></li>
							<li @click="moveRequestDown()"><i class="fa-solid fa-arrow-down"></i></li>
							<li @click="showContextMenuFolders($event)"><i class="fa-solid fa-turn-up"></i></li>
							<li @click="moveOutOfTheFolder()"><i class="fa-solid fa-turn-down"></i></li>
						</ul>
					</div>
				</template>
			</div>
	
			<div>
				<template x-if="isContextMenuFolderVisible">
					<div class="context-menu" @click.outside="isContextMenuFolderVisible = false" :style="{top: contextMenuPosition.y + 'px', left: contextMenuPosition.x + 'px'}">
						<ul style="display: flex; flex-direction: row">
							<li @click="moveFolderUp()"><i class="fa-solid fa-arrow-up"></i></li>
							<li @click="moveFolderDown()"><i class="fa-solid fa-arrow-down"></i></li>
							<li @click="deleteFolder()"><i class="fa-solid fa-trash"></i></li>
						</ul>
					</div>
				</template>
			</div>
	
			<div>
				<template x-if="isContextMenuFoldersVisible">
					<div  class="context-menu" @click.outside="isContextMenuFoldersVisible = false" :style="{top: contextMenuPosition.y + 'px', left: contextMenuPosition.x + 'px'}">
						<ul>
							<template x-for="(request, index) in data.requests" :key="index">
								<template x-if="request.folder">
									<li @click="moveRequest(request.folder)" x-text="request.folder"></li>
								</template>
							</template>
						</ul>
					</div>
				</template>
			</div>
	
			<div class="col-sm-3">
				<div id="divEndpoints" class="col-sm-12">
					<h2 style="display: flex; justify-content: space-between">
						Endpoints
						<button type="button" @click="showCreateFolder = true" class="rounded-lg p-2 text-white transition">
							<i class="fa-solid fa-folder-plus hover:text-gray-300"></i>
						</button>
					</h2>

					<template x-for="folder in data.folders" :key="folder">
						<details @contextmenu.prevent="showContextMenuFolder($event, folder)">
								<summary x-text="folder"></summary>

								<template
										x-for="(request, index) in data.requests.filter(r => r.folder === folder)"
										:key="index"
								>
										<div class="link">
												<a
														class="ml"
														href="#"
														:style="isActive(request) ? linkFolder : {}"
														@click.prevent="handleItem(request)"
														@contextmenu.prevent.stop="showContextMenuRequest($event, request)"
														x-text="request.name"
												></a>

												<span x-text="request.method"></span>
										</div>
								</template>
						</details>
				</template>

				<!-- Requests que estão na raiz -->
				<template x-for="(request, index) in data.requests.filter(r => !r.folder)" :key="index">
						<div class="link">
								<a
										href="#"
										:style="isActive(request) ? link : {}"
										@click.prevent="handleItem(request)"
										@contextmenu.prevent="showContextMenuRequest($event, request)"
										x-text="request.name"
								></a>

								<span x-text="request.method"></span>
						</div>
				</template>
				</div>
			</div>
	
			<div class="col-sm-5 panelRequest">
				<div id="divRequest" class="col-sm-12">
					<h2>Request</h2>
					
					<div class="form">
						<form id="api-form" class="row g-1">
							<div class="col-md-8">
								<label for="formFile" class="form-label">Carregar de arquivo</label>
								<input class="form-control" type="file" id="formFile" @change="handleFileSelect">
							</div>
							
							<div class="col-md-4 d-flex align-items-end">
								<button type="button" class="btn btn-primary w-100" @click="saveFile">Salvar</button>
							</div>
	
							<div class="col-md-3">
								<label for="method">Method:</label>
								<select class="form-select" id="method" x-model="method">
									<option value=""></option>
									<option value="GET">GET</option>
									<option value="POST">POST</option>
									<option value="PUT">PUT</option>
									<option value="DELETE">DELETE</option>
								</select>
							</div>
							
							<div class="col-md-7">
								<label for="url">URL:</label>
								<select class="form-select" x-model="url">
									<template x-for="(item, index) in data.urls" :key="index">
										<option :value="item" x-text="item"></option>
									</template>
								</select>
							</div>
	
							<div class="col-md-1 d-flex align-items-end justify-content-center">
								<button type="button" @click="openInsertUrl" class="rounded-lg bg-green-600 p-2 text-white transition hover:bg-green-500">
									<svg xmlns="http://www.w3.org/2000/svg" height="16" width="14" viewBox="0 0 448 512">
										<path d="M64 80c-8.8 0-16 7.2-16 16V416c0 8.8 7.2 16 16 16H384c8.8 0 16-7.2 16-16V96c0-8.8-7.2-16-16-16H64zM0 96C0 60.7 28.7 32 64 32H384c35.3 0 64 28.7 64 64V416c0 35.3-28.7 64-64 64H64c-35.3 0-64-28.7-64-64V96zM200 344V280H136c-13.3 0-24-10.7-24-24s10.7-24 24-24h64V168c0-13.3 10.7-24 24-24s24 10.7 24 24v64h64c13.3 0 24 10.7 24 24s-10.7 24-24 24H248v64c0 13.3-10.7 24-24 24s-24-10.7-24-24z"/>
									</svg>
								</button>
							</div>
	
							<div class="col-md-1 d-flex align-items-end justify-content-center">
								<button type="button" class="btn btn-danger" @click="removeUrl">
									<svg xmlns="http://www.w3.org/2000/svg" height="16" width="14" viewBox="0 0 448 512">
										<path d="M135.2 17.7L128 32H32C14.3 32 0 46.3 0 64S14.3 96 32 96H416c17.7 0 32-14.3 32-32s-14.3-32-32-32H320l-7.2-14.3C307.4 6.8 296.3 0 284.2 0H163.8c-12.1 0-23.2 6.8-28.6 17.7zM416 128H32L53.2 467c1.6 25.3 22.6 45 47.9 45H346.9c25.3 0 46.3-19.7 47.9-45L416 128z"/>
									</svg>
								</button>
							</div>
				
							<div class="col-md-12">
								<label for="endpoint">Endpoint:</label>
								<input type="text" class="form-control" id="endpoint" x-model="endpoint">
							</div>
				
							<div class="col-md-12">
								<label for="token">Token:</label>
								<input type="text" class="form-control" id="token" x-model="token">
							</div>
				
							<div class="col-md-12" id="divBody" x-show="method == 'POST' || method == 'PUT'">
								<label for="body">Body:</label>
								<textarea rows="6" class="form-control" id="body" x-model="body"></textarea>
							</div>
						</form>
					</div>
					
					<div id="buttonsForm">
						<button type="button" class="btn btn-primary mb-3" @click="makeRequest">
							<template x-if="!isLoading">
								<span>Enviar</span>
							</template>
							<template x-if="isLoading">
								<div id="loader"></div>
							</template>
						</button>
						<button type="button" class="btn btn-secondary mb-3" @click="clearFields">
							Limpar
						</button>
						<button type="button" class="btn btn-success mb-3" @click="saveRequest">
							Salvar
						</button>
						<button type="button" class="btn btn-success mb-3" @click="saveAsRequest" v-show="activeLink">
							Salvar Como
						</button>
						<button type="button" class="btn btn-danger mb-3" @click="removeRequest" id="btnRemoveRequest" v-show="activeLink">
							Remover
						</button>
					</div>
				</div>
			</div>
	
			<div class="col-sm-4 panelResponse">
				<div id="divResponse" class="col-sm-12">
					<div style="display: flex; justify-content: space-between;">
						<h2>Response</h2>
						<span x-show="status">Status: 
							<span id="status" :style="{background: (status >= 200 && status <= 299) ? 'green' : 'red', borderRadius: '5px', margin: '5px', padding: '3px'}" x-text="status"></span>
						</span>
					</div>
					<pre id="result" :style="{background: result ? '#0f0f0f' : '#242424', borderRadius: '5px', margin: '5px', padding: '3px'}" x-text="result"></pre>
				</div>
			</div>
		</div>
	</main>
</body>
</html

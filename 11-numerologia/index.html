<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="numerology.png" type="image/x-icon">
  <title>Numerologia</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1e1e2e 0%, #2d2d44 100%);
      color: #e0e0e0;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: rgba(45, 45, 68, 0.8);
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    h1 {
      text-align: center;
      color: #a78bfa;
      margin-bottom: 30px;
      font-size: 1.6em;
      text-shadow: 0 2px 10px rgba(167, 139, 250, 0.3);
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #b4b4b4;
      font-weight: 500;
      font-size: 0.95em;
    }

    input[type="text"] {
      width: 100%;
      padding: 8px 12px;
      background: rgba(60, 60, 80, 0.6);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #e0e0e0;
      font-size: 16px;
      transition: all 0.3s ease;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #a78bfa;
      box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.2);
      background: rgba(70, 70, 90, 0.8);
    }

    .input-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 15px;
    }

    .button-group {
      display: flex;
      gap: 15px;
      margin-top: 25px;
      margin-bottom: 30px;
    }

    button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    #calculate {
      background: linear-gradient(135deg, #a78bfa 0%, #8b5cf6 100%);
      color: white;
    }

    #calculate:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(167, 139, 250, 0.4);
    }

    #clean {
      background: linear-gradient(135deg, #64748b 0%, #475569 100%);
      color: white;
    }

    #clean:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(100, 116, 139, 0.4);
    }

    .result-section {
      margin-top: 30px;
    }

    .result-item {
      background: rgba(60, 60, 80, 0.4);
      border-radius: 10px;
      margin-bottom: 15px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .result-item:hover {
      border-color: rgba(167, 139, 250, 0.3);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }

    .result-header {
      padding: 15px 20px;
      background: rgba(70, 70, 90, 0.6);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.3s ease;
      user-select: none;
    }

    .result-header:hover {
      background: rgba(80, 80, 100, 0.8);
    }

    .result-header.active {
      background: linear-gradient(135deg, rgba(167, 139, 250, 0.2) 0%, rgba(139, 92, 246, 0.2) 100%);
      border-bottom: 1px solid rgba(167, 139, 250, 0.3);
    }

    .result-title {
      font-weight: 600;
      color: #e0e0e0;
      font-size: 1.1em;
    }

    .result-value {
      background: #a78bfa;
      color: #1e1e2e;
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.9em;
    }

    .chevron {
      width: 20px;
      height: 20px;
      border-right: 2px solid #b4b4b4;
      border-bottom: 2px solid #b4b4b4;
      transform: rotate(45deg);
      transition: transform 0.3s ease;
    }

    .chevron.rotated {
      transform: rotate(225deg);
    }

    .result-content {
      padding: 0 20px;
      max-height: 0;
      overflow: hidden;
      transition: all 0.3s ease;
      background: rgba(50, 50, 70, 0.3);
    }

    .result-content.expanded {
      max-height: 1000px;
      padding: 20px;
    }

    .result-text {
      color: #c4c4c4;
      line-height: 1.6;
      font-size: 0.95em;
      text-align: justify;
      text-justify: inter-word;
      hyphens: auto;
      word-spacing: 0.1em;
      text-indent: 2em;
    }

    .summary-section {
      background: linear-gradient(135deg, rgba(167, 139, 250, 0.1) 0%, rgba(139, 92, 246, 0.1) 100%);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid rgba(167, 139, 250, 0.2);
    }

    .summary-title {
      color: #a78bfa;
      font-size: 1.3em;
      font-weight: 600;
      margin-bottom: 15px;
      text-align: center;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }

    .summary-item {
      background: rgba(60, 60, 80, 0.5);
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .summary-label {
      color: #b4b4b4;
      font-size: 0.9em;
      margin-bottom: 5px;
    }

    .summary-value {
      color: #a78bfa;
      font-size: 1.2em;
      font-weight: bold;
    }

    @media (max-width: 500px) {
      .container {
        padding: 20px;
        margin: 10px;
      }

      .input-row {
        grid-template-columns: 1fr;
      }

      .button-group {
        flex-direction: column;
      }

      h1 {
        font-size: 1.8em;
      }

      .summary-grid {
        grid-template-columns: 1fr;
      }
    }

    .loading {
      display: none;
      text-align: center;
      padding: 20px;
      color: #a78bfa;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(167, 139, 250, 0.3);
      border-top: 4px solid #a78bfa;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>✨ Calculadora de Numerologia ✨</h1>

    <div class="form-group">
      <label for="name">Nome Completo:</label>
      <input type="text" id="name" placeholder="Digite seu nome completo...">
    </div>

    <div class="input-row">
      <div class="form-group">
        <label for="day">Dia:</label>
        <input type="text" id="day" placeholder="DD">
      </div>
      <div class="form-group">
        <label for="month">Mês:</label>
        <input type="text" id="month" placeholder="MM">
      </div>
      <div class="form-group">
        <label for="year">Ano:</label>
        <input type="text" id="year" placeholder="AAAA">
      </div>
    </div>

    <div class="button-group">
      <button id="calculate">Calcular</button>
      <button id="clean">Limpar</button>
    </div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>Calculando sua numerologia...</p>
    </div>

    <div id="result" class="result-section"></div>
  </div>
  
  <script>
    const codes = {
      "a": 1,"A": 1,"j": 1,"J": 1,"s": 1,"S": 1,
      "b": 2,"B": 2,"k": 2,"K": 2,"t": 2,"T": 2,
      "c": 3,"C": 3,"l": 3,"L": 3,"u": 3,"U": 3,
      "d": 4,"D": 4,"m": 4,"M": 4,"v": 4,"V": 4,
      "e": 5,"E": 5,"n": 5,"N": 5,"w": 5,"W": 5,
      "f": 6,"F": 6,"o": 6,"O": 6,"x": 6,"X": 6,
      "g": 7,"G": 7,"p": 7,"P": 7,"y": 7,"Y": 7,
      "h": 8,"H": 8,"q": 8,"Q": 8,"z": 8,"Z": 8,
      "i": 9,"I": 9,"r": 9,"R": 9
    }
    const vowels = ['a', 'A', 'e', 'E', 'i', 'I', 'o', 'O', 'u', 'U', 'y', 'Y']
    const excesses = {"1": 3, "2": 2, "3": 3, "4": 2, "5": 3, "6": 2, "7": 1, "8": 1, "9": 3}
    const masterNumbers = [11, 22, 33]
    const calculate = document.getElementById('calculate')
    const clean = document.getElementById('clean')
    const result = document.getElementById('result')
    const loading = document.getElementById('loading')

    function reduzirDigitos(num) {
      while (num >= 10) {
        num = num.toString().split('').reduce((soma, digito) => soma + parseInt(digito), 0)
      }
      return num
    }

    function lastBirthday(day, month) {
      const today = new Date()
      const currentYear = today.getFullYear()
      const birthdayThisYear = new Date(currentYear, month - 1, day)

      if (today >= birthdayThisYear) {
        return currentYear
      } else {
        return currentYear - 1
      }
    }

    function toggleSection(header) {
      const content = header.nextElementSibling;
      const chevron = header.querySelector('.chevron');
      
      if (content.classList.contains('expanded')) {
        content.classList.remove('expanded');
        header.classList.remove('active');
        chevron.classList.remove('rotated');
      } else {
        content.classList.add('expanded');
        header.classList.add('active');
        chevron.classList.add('rotated');
      }
    }

    function createSection(title, value, text) {
      return `
        <div class="result-item">
          <div class="result-header">
            <div class="result-title">${title}</div>
            <div style="display: flex; align-items: center; gap: 15px;">
              ${value ? `<div class="result-value">${value}</div>` : ''}
              <div class="chevron"></div>
            </div>
          </div>
          <div class="result-content">
            <div class="result-text">${text}</div>
          </div>
        </div>
      `
    }

    clean.addEventListener('click', () => {
      document.getElementById('name').value = ''
      document.getElementById('day').value = ''
      document.getElementById('month').value = ''
      document.getElementById('year').value = ''
      result.innerHTML = ''
    })

    calculate.addEventListener('click', () => {
      const name = document.getElementById('name').value.trim()
      const day = document.getElementById('day').value.trim()
      const month = document.getElementById('month').value.trim()
      const year = document.getElementById('year').value.trim()

      if (!name) {
        alert('Por favor, preencha todos os campos!')
        return
      }

      loading.style.display = 'block'
      result.innerHTML = ''

      setTimeout(() => {
        const birthday = day + month + year
        let inputTotal = 0
        let inputVowels = 0
        let inputConsoants = 0
        let inputBirthday = 0
        let personalYearNumber = 0
        let personalMonthNumber = 0
        let personalDayNumber = 0
        const counter = {}
        const missing = []
  
        for (const key of name) {
          if (codes.hasOwnProperty(key)) {
            const code = codes[key]
            counter[code] = (counter[code] || 0) + 1
            inputTotal += code
    
            if (vowels.includes(key)) {
              inputVowels += code
            } else {
              inputConsoants += code
            }
          }
        }
  
        for (let i = 1; i <= 9; i++) {
          if (!counter.hasOwnProperty(i)) {
            missing.push(i)
          }
        }
        
        Object.entries(counter).forEach(([num, quantity]) => {
          if (quantity <= excesses[num]) {
            delete counter[num]
          }
        })

        for (const char of birthday) {
          inputBirthday += Number(char)
        }
  
        const strLastBirthday = day + month + lastBirthday(day, month)
        if (birthday != '')  {
          for (const char of strLastBirthday) {
            personalYearNumber += Number(char)
          }
        }
  
        const today = new Date()
        if (!masterNumbers.includes(inputVowels)) inputVowels = reduzirDigitos(inputVowels)
        if (!masterNumbers.includes(inputConsoants)) inputConsoants = reduzirDigitos(inputConsoants)
        if (!masterNumbers.includes(inputTotal)) inputTotal = reduzirDigitos(inputTotal)
        if (!masterNumbers.includes(inputBirthday)) inputBirthday = reduzirDigitos(inputBirthday)
        if (birthday != '')  {
          personalYearNumber  = reduzirDigitos(personalYearNumber)
          personalMonthNumber = reduzirDigitos(Number(personalYearNumber) + Number(today.getMonth() + 1))
          personalDayNumber   = reduzirDigitos(Number(personalMonthNumber) + today.getDate())
        }

        let html = `
          <div class="summary-section">
            <div class="summary-title">Resumo da Sua Numerologia</div>
            <div class="summary-grid">
              <div class="summary-item">
                <div class="summary-label">Número da Alma</div>
                <div class="summary-value">${inputVowels}</div>
              </div>
              <div class="summary-item">
                <div class="summary-label">Número da Personalidade</div>
                <div class="summary-value">${inputConsoants}</div>
              </div>
              <div class="summary-item">
                <div class="summary-label">Número do Destino</div>
                <div class="summary-value">${inputTotal}</div>
              </div>
              <div class="summary-item">
                <div class="summary-label">Número da Lição de Vida</div>
                <div class="summary-value">${inputBirthday}</div>
              </div>
              <div class="summary-item">
                <div class="summary-label">Número do Ano Pessoal</div>
                <div class="summary-value">${personalYearNumber}</div>
              </div>
              <div class="summary-item">
                <div class="summary-label">Número do Mês Pessoal</div>
                <div class="summary-value">${personalMonthNumber}</div>
              </div>
            </div>
          </div>
        `

        // Seções principais
        html += createSection('Número da Alma', inputVowels, soulText[inputVowels]);
        html += createSection('Número da Personalidade', inputConsoants, personalityText[inputConsoants]);
        html += createSection('Número do Destino', inputTotal, destinationText[inputTotal]);

        if (birthday != '')  {
          html += createSection('Lição de Vida', inputBirthday, lifeLessonText[inputBirthday]);
        }

        // Números ausentes
        for (const absence of missing) {
          html += createSection(`Número Ausente: ${absence}`, absence, absenceText[absence]);
        }

        // Números em excesso
        Object.keys(counter).forEach(num => {
          html += createSection(`Número em Excesso: ${num}`, counter[num], excessesText[num]);
        });

        // Cristais para números ausentes
        for (const absence of missing) {
          html += createSection(`Cristais para Número ${absence}`, absence, crystalsText[absence]);
        }

        // Ciclos pessoais
        if (birthday != '')  {
          html += createSection('Ano Pessoal', personalYearNumber, personalYearText[personalYearNumber]);
          html += createSection('Mês Pessoal', personalMonthNumber, personalMonthText[personalMonthNumber]);
          html += createSection('Dia Pessoal', personalDayNumber, personalDayText[personalDayNumber]);
        }

        loading.style.display = 'none'
        result.innerHTML = html

        // Adicionar event listeners para os headers
        document.querySelectorAll('.result-header').forEach(header => {
          header.addEventListener('click', () => toggleSection(header))
        })
      }, 800)
    })

    const soulText = {
      "1": "Você traz um grande espírito de iniciativa e liderança, desenvolvido ao longo das suas vidas passadas. Você vivenciou um grande destaque na sociedade, nos negócios ou até no esporte e na cultura. Você gosta de traçar seus caminhos e prefere agir sozinho, tendo dificuldade em aceitar a opinião dos outros. Você aprendeu a ser idealista, lutando obstinadamente pelas suas convicções. Não suporta imposições, preferindo estabelecer e seguir suas próprias regras. A determinação e a força de vontade fizeram de você um pioneiro que aprecia as novidades. Você deve aproveitar sua grande força interior, o que o capacita a tomar iniciativas e a liderar empreitadas. Deve estar atendo para não cair na tentação de achar que sabe tudo e não precisa de contribuição dos outros, podendo assim tornar-se egoísta, dominador e intransigente.",
      "2": "Ao longo das usas vidas passadas, aprendeu a procurar sempre uma solução para os problemas, garantindo assim a harmonia no lar, no trabalho ou mesmo nos seus relacionamentos pessoais. Amante da paz trabalhou muito bem em grupo, normalmente sob o comando de um líder. Sua Alma lhe confere uma excepcional capacidade de discernimento, através da qual consegue separar o joio do trigo sem dificuldade. Sabe guardar segredos e dar conselhos como ninguém. Sua gentileza e amabilidade atraem principalmente aqueles que nos momentos difíceis procuram um ombro amigo. Você deve tirar proveito desse seu potencial de companheirismo e diplomacia para obter sucesso em tudo aquilo que faz, evitando assim que a indecisão e a insegurança atrapalhem a concretização de seus planos.",
      "3": "Ao longo das suas vidas passadas, aprendeu a não se abater diante dos problemas e sempre procurou encontrar o lado bom da vida. A alegria, o espírito desarmado e o otimismo foram os seus traços marcantes. Ser feliz é fazer os outros felizes: esse é o seu lema. Seu sorriso estampado no rosto e seu estilo espirituoso são envolventes. Desenvolveu um grande poder de comunicação e uma criatividade aguçada. Nos momentos mais difíceis consegue minimizar o sofrimento, confortando os mais entristecidos. Se o ambiente estiver descontraído, melhor ainda: aí é que você se solta, contagiando os que estão à volta. Você deve capitalizar seu bom humor e otimismo com vistas a atingir os seus objetivos, evitando a superficialidade, a mentira, o narcisismo e a propensão a fazer fofocas, defeitos que podem se manifestar a qualquer hora.",
      "4": "Ao longo das suas vidas passadas, acumulou um grande espírito prático voltado ao trabalho bem feito. Exigente e perfeccionista aprendeu a agir de forma organizada e sem precipitação. Aprendeu a trabalhar com eficiência e colhendo bons resultados, pois costuma lograr êxito, principalmente material, em tudo aquilo que faz. Desde a decoração de sua casa até o  desenvolvimento de um projeto é cauteloso e não costuma se envolver em aventuras perigosas. Aprendeu a ser prudente, considerando primeiro os obstáculos a serem transpostos para depois avaliar os benefícios. Você deve assumir aquilo que verdadeiramente é: trabalhador, eficiente e meticuloso. Não deve ficar preocupado com acusações e ciúmes, caso contrário pode enveredar para o caminho da improdutividade, negligência e medo.",
      "5": "Você traz um amor pela liberdade desenvolvido ao longo das suas vidas passadas. Nunca aceitou que alguém interferisse nas suas decisões. Ser feliz, para você, é poder ir e vir. O excesso de rotinas o deixa irritado, pois você prefere o inusitado, o surpreendente e o inesperado. Foge sempre da monotonia; seu desejo insaciável de viajar vem da sua vivência e da sua necessidade de liberdade. É atraído por novas perspectivas. Aventuras não-convencionais o seduzem. Você desenvolveu muitos talentos e possui diversos interesses. Sua mente é brilhante, e sua curiosidade faz com que explore novas idéias sem preconceitos. Deve tomar cuidado caso esteja com dificuldade momentânea de expressar esse seu jeito de ser, para não sucumbir ao vício (drogas, alcoolismo, jogos, etc.) e a atitudes irresponsáveis.",
      "6": "Você traz um espírito de enorme responsabilidade voltado para a harmonia familiar, desenvolvido ao longo das suas vidas passadas. Fiel no casamento dedica-se com louvor ao bem-estar e à felicidade daqueles que o cercam. Tem uma sensibilidade muito aguçada e é capaz de restabelecer a paz entre aqueles que estão à sua volta. Cumpre seus deveres com primazia e não foge aos seus compromissos. Prefere trabalhar em grupo a trabalhar de forma individual. Você deve aproveitar o dom que possui e construir assim um mundo mais harmônico e justo. No entanto, tome cuidado para não se tornar possessivo.",
      "7": "Você traz a sabedoria e a justiça desenvolvidas ao longo das suas vidas passadas. Procurou sempre analisar os fatos com profundidade para então chegar a uma conclusão que o levasse a ações seguras. Na gosta que pairem dúvidas sobre as suas atitudes. Consegue através da busca da espiritualidade uma forma de iluminar os seus caminhos. A retidão na conduta é mais importante que o prazer. Prefere as companhias que gostem de filosofar sobre a vida e muitas vezes gosta de ficar só. E aí, sozinho, encontra na introspecção a oportunidade de questionar e analisar tudo o que o cerca. Você aprendeu a entrar em sintonia com você mesmo, desenvolvendo seus próprios recursos. Você deve aproveitar sua espiritualidade e seu sendo refinado de justiça para conquistar seu espaço, mas não pode descuidar, pois tende a entrar em melancolia.",
      "8": "Você aprendeu os benefícios de uma rígida disciplina, inteligência e eficiência desenvolvidas ao longo das suas vidas passadas, quando teve a oportunidade de colocar sua habilidade executiva em ação. Sua ambição e perspicácia o habilitam a organizar empreendimentos de vulto ou abraçar grandes causas. Sua determinação e sua vitalidade física contribuem para que exerça uma grande liderança nas atividades de que toma parte. É grande o seu desejo de ocupar altas posições e obter prosperidade material. Você é dotado de muita energia, mas precisa aprender a aceitar seus próprios erros e não exigir demais de si próprios. Você deve aproveitar toda sua disposição e capacidade de liderança, e controlar o lado materialista, a intolerância, e em especial a sede de poder.",

      "4": "Disciplinado, Metódico e Confiável - Sua Lição de Vida é aprender a agir com organização, assumindo apenas os riscos que ofereçam uma boa margem de segurança. Você deve ser abnegado, paciente, honesto e racional, aprendendo a conviver com algumas limitações que a vida possa impor, de ordem física, material e emocional, provocadas pelo ambiente ou por outras pessoas. Deve procurar realizar suas tarefas com responsabilidade e eficiência, dando importância aos detalhes, para conquistar assim a confianças das outras pessoas. Agindo com organização e dedicação, construirá um futuro materialmente seguro. Deve evitar o autoritarismo, a impaciência e a rigidez exagerada, tomando cuidado para não perder o controle quando tudo não é exatamente do jeito que você quer.",
      "5": "Versátil, Curioso e Aventureiro - Sua Lição de Vida é aprender a usar adequadamente sua liberdade. A vida oferecerá muitas oportunidades, mudanças e aventuras. Somente agindo com responsabilidade, valorizando-se e usando a liberdade de maneira construtiva é que conseguirá o que deseja. Aproveite seus inúmeros talentos e procure desenvolver a versatilidade para poder lidar com as inúmeras experiências que surgirão ao longo do seu caminho. Você deve aproveitar o seu carisma para ter êxito em atividades que envolvam contato com o público. Viagens e novas experiências podem ser transformadas em boas oportunidades para o amadurecimento pessoal. Não abuse da sua grande sensualidade e não permita que a rotina o aborreça, tomando cuidado para não sucumbir à irresponsabilidade, à dispersão e a vícios tais como a bebida e a droga.",
      "6": "Responsável, Dedicado e Justo Sua Lição de Vida é desenvolver o senso de responsabilidade para com a família e a comunidade. Deve aprender também a ter um bom senso de justiça. Você deve dar ajuda e conforto às pessoas que o procuram, colocando o bem-estar do grupo, da família e da comunidade acima do seu. É fundamental que desenvolva o senso de justiça, aprendendo a encontrar o equilíbrio em situações em que haja conflito. A arte e a beleza o fascinam, e ajudarão a deixa-lo em harmonia com as pessoas e os ambientes que freqüenta.",
      "7": "Intuitivo, espiritual e Analítico - Sua Lição de Vida é conhecer a si próprio e confiar na sua intuição para então encontrar o seu caminho. Através de um trabalho de autoconhecimento você buscará respostas para os mistérios da vida. Evite aceitar a opinião dos outros como a palavra final, pesquisando bastante até chegar a uma conclusão própria. Você optará por conviver com pessoas que tenham objetivos semelhantes e os mesmos questionamentos. Procure compreender a vida estudando a filosofia em geral e as ciências esotéricas, nas quais encontrará informações e conceitos fundamentais para a sua realização. Esta é uma lição de intensa espiritualidade. Não seja demasiadamente impaciente. Evite também o isolamento, não se deixando envolver pela melancolia. Cuidado para que as dúvidas não o tornem uma pessoa insegura.",
      "8": "Perseverante, Energético e Determinado - Sua Lição de Vida é aprender a lidar de maneira positiva e ponderada com o mundo material e o poder. Você deverá agir com determinação e conhecimento do que está fazendo. Poderá construir um império comercial e o seu sucesso será motivo de inspiração para muita gente. Aproveite a sua ambição e a sua capacidade de organização. Confie em si próprio e desenvolva a sua grande habilidade administrativa e executiva. É necessário ter excelente equilíbrio e discernimento para julgar e encontrar a verdade. Seja realista e não alimente fantasias. Não pode ser excessivamente ambicioso, tomando cuidado para não se deixar envolver pela avareza, pelo materialismo e pelo egoísmo. Atenção para o abuso de poder.",
      "9": "Humanitário, Generoso e Tolerante - Sua Lição de Vida é desenvolver a compaixão e a capacidade de doar-se sem esperar nada em troca, pelo simples prazer de ser útil a alguém. Sensível e idealista você poderá ficar freqüentemente desapontado com as imperfeições do mundo. Romântico, quando estiver amando, apaixonar-se-á profundamente. Você é criativo e ao usar seus talentos conseguirá angariar facilmente o reconhecimento público e a amizade dos que o cercam. Você deve aprender a preservar e utilizar as riquezas que vier a acumular em proveito dos mais necessitados. Procure entender que o verdadeiro caminho da felicidade é servir aos outros e nunca agir de forma mesquinha. Suas recompensas virão naturalmente. Nesta lição há lutas e desafios, e o seu crescimento virá em função de como você lida com essas provas. Deve tomar cuidado para não se deixar envolver pelo egoísmo, pela falta de ética e pela indiferença.",
      "11": "Idealista, Visionário e Inspirado - Este é um Número de importância espiritual, sujeito à ansiedade e instabilidade emocional. Para viver à altura do seu ideal precisará ter talento e coragem. Sua Lição de Vida é aprender a tomar consciência do mundo espiritual e relacionar-se com o mundo material, vivenciando os seus ideais e trabalhando para torna-los realidade. Você é idealista e perfeccionista. O seu magnetismo pessoal e a sua capacidade de compreensão ajudarão a atrair as outras pessoas. Você deve aprender a desenvolver a sua intuição, procurando transmitir todo o seu conhecimento e sabedoria para os outros e abrindo novos caminhos para que estes possam seguir. Deverá ser um autêntico exemplo de vida. Deve tomar cuidado para não ser envolvido pela ambição, a qual poderá trazer a sua ruína, pois o seu sucesso estará sempre associado ao bem da humanidade. Caso não vivencie esta Lição à altura do ideal deste Número Mestre, deve consultar a Lição de Vida 2, que é o resultado da soma de 1 + 1.",
      "22": "Construtor, Prático e Realizador - Este é um Número Mestre de importância espiritual voltada para a realização material. Sua Lição de Vida é desenvolver sua capacidade de transformar sonhos em grandes obras, que beneficiem muitas pessoas em âmbito nacional ou até mesmo mundial. Você possui as mesmas qualidades do 11, mas em vez de atuar no plano material, prefere atuar mais no plano físico. Você é mestre-construtor e terá o poder de ser bem-sucedido em qualquer área que lhe interessar. Possui alto nível de consciência e uma capacidade ímpar de compreensão. O seu desafio é descobrir como usar todos esses dons de maneira produtiva. Aos poucos você perceberá a sua competência e o seu poder, aumentando a sua autoconfiança. Deve tomar cuidado para não se deixar envolver pela avareza, pela corrupção e pela manipulação. Caso não vivencie esta Lição à altura do ideal deste Número Mestre, deve consultar a Lição de Vida 4, que é o resultado da soma de 2 + 2.",
      "33": "Doador Incondicional - Sua Lição de Vida é aprender a doar-se em prol de seus semelhantes. Este é um Número de importância espiritual, sujeito a ansiedade e instabilidade emocional. Para viver à altura do seu ideal precisará ter amor incondicional e coragem. Você deve procurar servir aos outros e sua recompensa será destinada á continuidade da sua obra. Jamais conseguirá exercer uma profissão que vise o benefício próprio. Seu exemplo de coragem, determinação e humildade servirá como estímulo à humanidade. No entanto, é muito difícil vivenciar integralmente este Número Mestre, pois ele exige uma entrega pessoal plena. As pessoas que possuem o Número 33 como Lição de Vida dificilmente conseguem viver à altura do potencial deste Número, devendo então consultar a Lição de Vida 6, que é o resultado da soma de 3 + 3.",

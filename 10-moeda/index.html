<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <script src="script.js"></script>
  <title>Moeda</title>
</head>
<body class="min-h-screen bg-[#111827] text-gray-300">
  <main class="min-h-screen bg-[radial-gradient(ellipse_at_15%_0%,rgba(99,102,241,0.18),transparent_38rem)] bg-no-repeat flex justify-center">
    <div id="app" class="bg-[#192233] rounded-2xl shadow-lg border border-[#293449] w-1/3 h-full p-6 mt-18 flex flex-col items-center" x-data="data()">
      <div class="text-center">
        <h1 class="font-weight-normal text-3xl">Moeda<span></h1>
      </div>
  
      <div class="w-full">
        <label class="mb-1 block">Valor:</label>
        <input type="Text" id="quantidade" class="text-gray-300 w-full border border-gray-600 p-2 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" autofocus x-model="quantity">
      </div>
  
      <div class="w-full">
        <label class="mb-1 mt-2 block">De:</label>
        <select id="moeda1" class="text-gray-300 w-full border border-gray-600 p-2 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" x-model="coinFrom">
          <option></option>
          <template x-for="coin in coins">
            <option :value="coin.sigla">
              <span x-text="coin.pais"></span> - <span x-text="coin.moeda"></span>
            </option>
          </template>
        </select>
      </div>
  
      <button class="border border-gray-600 mt-2 p-1 rounded-md w-1/3 text-2xl" @click="inverter">&uarr;&darr;</button>
  
      <div class="w-full">
        <label class="mb-1 mt-2 block">Para:</label>
        <select id="moeda2" class="text-gray-300 w-full border border-gray-600 p-2 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" x-model="coinTo">
          <option></option>
          <template x-for="coin in coins">
            <option :value="coin.sigla">
              <span x-text="coin.pais"></span> - <span x-text="coin.moeda"></span>
            </option>
          </template>
        </select>
      </div>
  
      <div class="flex gap-2 mt-2">
        <button class="p-2 rounded-md bg-green-600/50 hover:bg-green-500/60 cursor-pointer" @click="consultaMoeda">
          Calcular
        </button>
        <button class="p-2 rounded-md bg-gray-600/50 hover:bg-gray-500/50 cursor-pointer" @click="limpar">
          Limpar
        </button>
      </div>
  
      <div id="return" x-html="response" class="mt-4 text-xl"></div>
    </div>
  </main>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Gerador de QR Code</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../style.css" />
</head>
<body class="qr-app">
  <main>
    <div class="app-panel qr-panel">
    <h1>Gerador de QR Code</h1>

    <input class="app-input" type="text" id="qr-input" placeholder="Ex: https://meusite.com" aria-label="Texto ou URL para gerar o QR Code" />
    <button class="button-primary qr-generate-button" id="qr-btn">Gerar QR Code</button>

    <div class="qr-wrapper">
      <canvas id="qr-canvas"></canvas>
    </div>
    </div>
  </main>

  <script src="lib.js"></script>

  <script>
    const qr = new QRious({
      element: document.getElementById('qr-canvas'),
      size: 240,
      value: ''
    });

    const input = document.getElementById('qr-input');
    const button = document.getElementById('qr-btn');

    button.addEventListener('click', () => {
      const text = input.value.trim();

      if (!text) {
        alert('Digite algum texto ou URL para gerar o QR Code.');
        return;
      }

      qr.value = text;
    });

    input.addEventListener('keyup', (e) => {
      const text = e.target.value.trim();
      qr.value = text ? text : '';
    });
  </script>
</body>
</html>
